name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — lint, type-check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3; no moving major tag upstream
        with:
          python-version: "3.14"   # same as production
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies (lock)
        run: uv sync --locked

      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --format requirements-txt --frozen -q -o requirements.txt
          git diff --exit-code requirements.txt

      - name: Ruff lint
        run: uv run --locked ruff check app tests

      - name: Ruff format check
        run: uv run --locked ruff format --check app tests

      - name: mypy
        run: uv run --locked mypy --config-file pyproject.toml app
        env:
          MYPYPATH: .

      - name: pytest
        env:
          AEGIS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis_test
          # At least 32 bytes, or PyJWT warns about a short HS256 key.
          AEGIS_SECRET_KEY: ci-only-secret-key-at-least-32-bytes-long
        run: uv run --locked pytest tests/ -v

  frontend:
    name: Frontend — type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
